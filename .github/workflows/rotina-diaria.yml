# Rotina diária na nuvem, com a máquina desligada. Exige o segredo ANTHROPIC_API_KEY no repositório
# (Settings > Secrets and variables > Actions). Em repositório público, o GitHub desliga o agendamento
# depois de 60 dias sem atividade.
name: rotina-diaria
on:
  schedule:
    - cron: "30 10 * * *" # 10:30 UTC = 07:30 em Brasília
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  checkup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: "Faça o checkup do projeto como na skill healthy e responda com o veredito na primeira linha. Não edite nada."
          claude_args: "--model sonnet --max-turns 15"
